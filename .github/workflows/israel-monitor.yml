name: Daily Israel-region CH4 satellite check
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest_israel.py'
      - 'tests/test_israel_monitor.py'
      - '.github/workflows/israel-monitor.yml'
permissions:
  contents: write
concurrency:
  group: ch4-israel-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
      - name: Verify ingestion logic
        run: python3 -m unittest discover -s tests -v
      - name: Query Carbon Mapper and record status (no email)
        id: ingest
        continue-on-error: true
        env:
          CARBON_MAPPER_API_TOKEN: ${{ secrets.CARBON_MAPPER_API_TOKEN }}
        run: python3 scripts/ingest_israel.py
      - name: Commit updated evidence status and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/israel-monitor.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update CH4 Israel-region source status [skip ci]"
            git push origin HEAD:main
          fi
      - name: Flag source connection failures
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::Carbon Mapper query failed. The monitor preserved saved observations. See public/data/israel-monitor.json and configure API credentials if required."
          exit 1
